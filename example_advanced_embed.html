<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>게임 임베드 - 고급 예제</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
      margin: 0;
      min-height: 100vh;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    h1 { color: #333; margin-top: 0; }
    .profile-section {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .profile-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 15px;
    }
    .profile-info div {
      background: rgba(255,255,255,0.1);
      padding: 15px;
      border-radius: 6px;
    }
    .profile-info label {
      display: block;
      font-size: 12px;
      opacity: 0.9;
      margin-bottom: 5px;
    }
    .profile-info input, .profile-info select {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }
    .game-wrapper {
      width: 100%;
      margin: 30px 0;
      border: 3px solid #667eea;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }
    iframe {
      width: 100%;
      height: 500px;
      border: none;
      display: block;
    }
    .results-section {
      background: #f5f5f5;
      padding: 20px;
      border-radius: 8px;
      margin-top: 30px;
      display: none;
    }
    .results-section.show {
      display: block;
    }
    .result-item {
      background: white;
      padding: 15px;
      margin: 10px 0;
      border-radius: 6px;
      border-left: 4px solid #667eea;
    }
    .result-item.win {
      border-left-color: #4caf50;
    }
    .result-item.lose {
      border-left-color: #f44336;
    }
    .status {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      margin-left: 10px;
    }
    .status.pending {
      background: #ffc107;
      color: #333;
    }
    .status.verified {
      background: #4caf50;
      color: white;
    }
    .status.error {
      background: #f44336;
      color: white;
    }
    .info {
      background: #e3f2fd;
      padding: 15px;
      border-left: 4px solid #2196f3;
      margin: 20px 0;
      border-radius: 4px;
      font-size: 14px;
    }
    button {
      background: #667eea;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }
    button:hover {
      background: #764ba2;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎮 점프&서바이브 - 고급 임베드 예제</h1>

    <div class="profile-section">
      <h3 style="margin-top: 0;">👤 플레이어 정보</h3>
      <div class="profile-info">
        <div>
          <label>플레이어 ID:</label>
          <input type="text" id="playerId" value="player_001" placeholder="고유한 플레이어 ID">
        </div>
        <div>
          <label>플레이어 이름:</label>
          <input type="text" id="playerName" value="테스트 플레이어" placeholder="플레이어 이름">
        </div>
        <div>
          <label>난이도:</label>
          <select id="difficulty">
            <option value="EASY">EASY</option>
            <option value="NORMAL" selected>NORMAL</option>
            <option value="HARD">HARD</option>
          </select>
        </div>
        <div>
          <button onclick="startGame()">🎮 게임 시작</button>
        </div>
      </div>
    </div>

    <div class="game-wrapper">
      <iframe
        id="gameFrame"
        src="jump-survive.html">
      </iframe>
    </div>

    <div class="results-section" id="resultsSection">
      <h3>📊 최근 게임 결과</h3>
      <div id="resultsList"></div>
    </div>

    <div class="info">
      <strong>⚠️ 중요:</strong>
      이것은 데모용 예제입니다. 실제 운영 환경에서는:
      <ul>
        <li>게임 결과를 서버에서 검증해야 합니다 (클라이언트 결과만으로는 부정행위 가능)</li>
        <li>플레이어 인증(로그인)이 필요합니다</li>
        <li>보상 지급 전 서버측 검증을 완료해야 합니다</li>
        <li>모든 결과를 데이터베이스에 기록해야 합니다</li>
      </ul>
    </div>
  </div>

  <script>
    const gameFrame = document.getElementById('gameFrame');
    const resultsList = document.getElementById('resultsList');
    const resultsSection = document.getElementById('resultsSection');
    let results = [];

    function startGame() {
      const playerId = document.getElementById('playerId').value;
      const playerName = document.getElementById('playerName').value;
      const difficulty = document.getElementById('difficulty').value;

      if (!playerId || !playerName) {
        alert('플레이어 ID와 이름을 입력하세요');
        return;
      }

      resultsSection.classList.remove('show');

      setTimeout(() => {
        gameFrame.contentWindow.postMessage({
          type: 'gameConfig',
          difficulty: difficulty,
          playerId: playerId,
          playerName: playerName
        }, '*');
      }, 100);
    }

    function verifyGameResult(result) {
      // 시뮬레이션: 실제로는 서버에 보내서 검증
      return new Promise(resolve => {
        setTimeout(() => {
          // 간단한 검증: 합리적인 범위 내인지 확인
          const isValid = result.survived >= 0 && result.survived <= result.duration * 1.1;
          resolve({
            verified: isValid,
            verificationTime: new Date().toLocaleTimeString('ko-KR'),
            message: isValid ? '검증 완료' : '유효하지 않은 결과'
          });
        }, 1000);
      });
    }

    window.addEventListener('message', async function(event) {
      if (event.data.type === 'gameResult') {
        const result = event.data;

        // 결과 검증
        const verification = await verifyGameResult(result);

        const record = {
          timestamp: new Date().toLocaleTimeString('ko-KR'),
          playerId: result.playerId,
          playerName: result.playerName,
          difficulty: result.difficulty,
          survived: result.survived.toFixed(1),
          duration: result.duration,
          isWin: result.isWin,
          verification: verification
        };

        results.unshift(record);
        updateResultsDisplay();
      }
    });

    function updateResultsDisplay() {
      resultsSection.classList.add('show');
      resultsList.innerHTML = results.map(r => `
        <div class="result-item ${r.isWin ? 'win' : 'lose'}">
          <strong>${r.playerName} (${r.playerId})</strong>
          <span class="status ${r.verification.verified ? 'verified' : 'error'}">
            ${r.verification.message}
          </span>
          <br>
          <small>${r.timestamp}</small>
          <br>
          난이도: <strong>${r.difficulty}</strong> |
          생존: <strong>${r.survived}초/${r.duration}초</strong> |
          결과: ${r.isWin ? '✅ 성공' : '❌ 실패'}
        </div>
      `).join('');
    }

    // 페이지 로드 시 초기 상태
    window.addEventListener('load', function() {
      console.log('고급 게임 임베드 준비 완료');
    });
  </script>
</body>
</html>
